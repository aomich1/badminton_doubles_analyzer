<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4f2;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.video-actions{display:flex;flex-wrap:wrap;gap:8px}.video-actions .filebtn{display:inline-flex;align-items:center}button,.filebtn,select{background:#263536;border:1px solid #405555;border-radius:7px;color:#edf4f2;padding:8px 11px;font:inherit;cursor:pointer}button:hover,.filebtn:hover{border-color:var(--accent)}button.primary{background:#1a684e;border-color:#329671}.filebtn input{display:none}.layout{display:grid;grid-template-columns:minmax(460px,1.55fr) minmax(360px,1fr);gap:12px;padding:12px;max-width:1600px;margin:auto}.panel{background:var(--panel);border:1px solid #283839;border-radius:10px;padding:14px;min-width:0}.video-panel{display:flex;flex-direction:column;gap:10px}.video-wrap{background:#070a0b;border-radius:8px;min-height:290px;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}.video-wrap video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.placeholder{color:var(--muted);text-align:center;line-height:1.8;padding:20px}.controls{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px}.controls input{width:100%;accent-color:var(--accent)}.small{font-size:12px;color:var(--muted)}h2{font-size:15px;margin:0 0 7px}.section{margin-bottom:14px}.help,.setup-status,.footer{display:none!important}.court-wrap{display:grid;place-items:center}.court{position:relative;width:min(100%,350px);height:350px;background:#176b4c;border:2px solid #eaf7f1;border-radius:3px;overflow:hidden;cursor:crosshair}.court:before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 20%,#ffffff 20%,#ffffff calc(20% + 1px),transparent calc(20% + 1px),transparent 50%,#fff 50%,#fff calc(50% + 3px),transparent calc(50% + 3px),transparent 80%,#fff 80%,#fff calc(80% + 1px),transparent calc(80% + 1px)),linear-gradient(to right,transparent 20%,#ffffff 20%,#ffffff calc(20% + 1px),transparent calc(20% + 1px),transparent 80%,#fff 80%,#fff calc(80% + 1px),transparent calc(80% + 1px));pointer-events:none}.player-dot{position:absolute;z-index:2;width:19px;height:19px;margin:-9px;border-radius:50%;border:2px solid #10251c;box-shadow:0 1px 5px #001a12aa;transform:translate(-50%,-50%);pointer-events:none}.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:4px}.swatch{width:10px;height:10px;border-radius:50%}.row{display:grid;grid-template-columns:95px 1fr;align-items:center;gap:8px;margin:6px 0}.row select{width:100%}.outfit-controls{display:flex;gap:6px;min-width:0}.outfit-controls select{flex:1;min-width:80px}.outfit-controls button{white-space:nowrap;font-size:12px;padding:6px 8px}.legend .outfit-state{font-size:10px;font-weight:500}.legend .outfit-saved .outfit-state{color:var(--accent)}.footer{padding:0 14px 14px;color:var(--muted);font-size:11px}@media(max-width:900px){.layout{grid-template-columns:1fr}.video-wrap{min-height:220px}}
.court{width:min(100%,620px);height:auto;aspect-ratio:13400/6100;border:0;background:#176b4c}
.court:before{display:none}

.video-wrap{position:relative}.video-wrap video{position:absolute;inset:0}#detectOverlay{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}#detectOverlay.editing{pointer-events:auto;cursor:crosshair}.setup-actions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.setup-actions button,.setup-actions select{font-size:12px;padding:6px 8px}.setup-status{font-size:11px;color:var(--muted);line-height:1.45;min-height:18px}
.player-dot{display:grid;place-items:center;color:#10201b;font-size:10px;font-weight:800}.court-detection-label{position:absolute;z-index:2;left:50%;top:8%;transform:translateX(-50%);padding:3px 8px;border:1px solid #b7f4d4;border-radius:12px;background:#073c2ecc;color:#effff7;font-size:11px;font-weight:700;white-space:nowrap;pointer-events:none}
</style>

<body>
<main class="layout">
<section class="panel video-panel"><div class="video-wrap" id="videoWrap"><div class="placeholder" id="placeholder"></div><video id="video" controls playsinline hidden></video><canvas id="detectOverlay" hidden></canvas></div><div class="controls"><button id="backFrame" title="1フレーム戻る">◀ 1コマ</button><button id="forwardFrame" title="1フレーム進む">1コマ ▶</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="clock" class="small">00:00.0 / 00:00.0</span></div><div class="video-actions"><label class="filebtn">動画を開く<input id="videoFile" type="file" accept="video/*,.mov,.mp4,.m4v,.avi,.mkv,.3gp"></label><button id="loadProject">プロジェクトを開く</button><button id="saveProject" class="primary">プロジェクトを保存</button><button id="quit">アプリを終了</button><input id="projectFile" type="file" accept=".bdx,.json,application/json" hidden></div></section>
<section class="panel">
<div class="court-wrap"><div id="court" class="court"><svg class="court-lines" viewBox="0 0 13400 6100" preserveAspectRatio="none" aria-label="実寸比のバドミントンコート"><g fill="none" stroke="#399cff" stroke-width="40"><rect x="20" y="20" width="13360" height="6060"/><path d="M0 460H13400 M0 5640H13400"/><path d="M4720 0V6100 M8680 0V6100"/><path d="M760 0V6100 M12640 0V6100"/><path d="M6700 0V6100"/><path d="M0 3050H4720 M8680 3050H13400"/></g></svg></div></div><div class="section"><h2>解析前の初期設定</h2><div class="setup-actions"><button id="runSetup">コートを自動検出</button><button id="detectPlayers">選手を検出・照合</button><button id="confirmCourt">コート確定</button><button id="confirmPlayers">4人確定</button><button id="editSetup">設定を修正</button><select id="orientation"><option value="standard">コート向き: 標準</option><option value="rotate">90°回転</option><option value="flip">左右反転</option></select></div><div class="small" id="outfitStatus" style="margin:4px 0 8px">服・靴の色を学習済み 0/4人</div><div id="setupStatus" class="setup-status">動画を開くとコート候補を検出します</div><div class="row"><label for="positionPlayer">割り当て先</label><div class="outfit-controls"><select id="positionPlayer"></select><button id="savePlayerOutfit">服・靴の色を学習</button></div></div><div class="row"><label for="poseCandidate">検出候補</label><div class="outfit-controls"><select id="poseCandidate"><option value="">候補を検出してください</option></select><button id="assignCandidate">選手に割当</button></div></div><div class="legend" id="legend"></div><div class="small" id="positionCount">位置記録 0 件</div></div>
</section></main>
<div id="status" hidden></div>
<script>
(()=>{
const names=['プレイヤー1','プレイヤー2','プレイヤー3','プレイヤー4'],colors=['#ffd166','#f8961e','#81c3d7','#b8f2a1'];
const legacyNames=['自分ペア A','自分ペア B','相手ペア A','相手ペア B'];
const normalizePlayer=name=>{const i=legacyNames.indexOf(name);return i<0?name:names[i]};
const data={format:'badminton-doubles-analyzer',version:4,courtLayout:'landscape',videoName:'',courtCorners:null,courtRotate:false,courtOrientation:'standard',courtLineColor:null,clothingColors:{},appearanceSamples:{},initialPlayers:{},detectedPlayers:[],positions:[],events:[],rallies:[]};
const $=id=>document.getElementById(id), video=$('video'),court=$('court'),overlay=$('detectOverlay');let objectUrl=null,pendingStart=null,poseTask=null,rawPlayers=[],poseCandidates=[],editingSetup=false,dragCorner=-1,courtH=null,courtBackH=null,projectLoaded=false,setupStage='court',lastTrackTime=-1,trackingBusy=false;
function initializePlayerData(){data.clothingColors={};data.appearanceSamples={};data.initialPlayers={};data.detectedPlayers=[];data.positions=[];data.events=[];data.rallies=[];rawPlayers=[];poseCandidates=[]}
initializePlayerData();
for(const id of ['positionPlayer']) names.forEach((name,i)=>{const o=document.createElement('option');o.value=name;o.textContent=name;$ (id).appendChild(o)});
names.forEach((name,i)=>{const s=document.createElement('span');s.dataset.player=name;s.innerHTML=`<i class="swatch" style="background:${colors[i]}"></i>${name} <b class="outfit-state">未登録</b>`;$('legend').appendChild(s)});
const fmt=t=>{t=Math.max(0,Number(t)||0);return `${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(1).padStart(4,'0')}`};
function setStatus(s){$('status').textContent=s;setTimeout(()=>{$('status').textContent=''},3500)}
function appearanceProfile(name){const samples=(data.appearanceSamples[name]||[]).filter(s=>s&&(s.shirt||s.shoes));const legacy=data.clothingColors[name];if(legacy&&!samples.some(s=>s.shirt&&rgbDistance(s.shirt,legacy)<.005))samples.unshift({shirt:legacy});return samples}
function refreshCandidateOptions(){const select=$('poseCandidate'),selected=select.value;select.replaceChildren();if(!poseCandidates.length){const option=document.createElement('option');option.value='';option.textContent='候補を検出してください';select.appendChild(option);return}poseCandidates.forEach((candidate,index)=>{const option=document.createElement('option');option.value=String(index);const assigned=candidate.player?` · ${candidate.player}`:'';option.textContent=`候補 ${index+1} · 確信度 ${Math.round(candidate.confidence*100)}%${assigned}`;select.appendChild(option)});if([...select.options].some(option=>option.value===selected))select.value=selected;else select.selectedIndex=0}
function redraw(){refreshCandidateOptions();court.querySelectorAll('.player-dot,.court-detection-label').forEach(n=>n.remove());for(const name of names){const p=[...data.positions].reverse().find(v=>v.player===name&&v.time<=video.currentTime)||data.initialPlayers[name];if(!p)continue;const dot=document.createElement('i');dot.className='player-dot';dot.textContent=String(names.indexOf(name)+1);dot.style.left=`${p.x*100}%`;dot.style.top=`${p.y*100}%`;dot.style.background=colors[names.indexOf(name)];dot.title=`${name}${p.manual?' · 手動修正':''}`;court.appendChild(dot)}const n=Object.keys(data.initialPlayers).length,profiles=names.filter(name=>appearanceProfile(name).length).length;$('positionCount').textContent=`初期検出 ${n}/4 人 ・ 位置記録 ${data.positions.length} 件`;$('outfitStatus').textContent=`服・靴の色を学習済み ${profiles}/4人`;for(const item of $('legend').children){const count=appearanceProfile(item.dataset.player).length;item.querySelector('.outfit-state').textContent=count?`学習${count}件`:'未学習';item.classList.toggle('outfit-saved',!!count)}drawOverlay()}

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function sortQuad(points){const c=points.reduce((a,p)=>({x:a.x+p.x/4,y:a.y+p.y/4}),{x:0,y:0});let q=points.slice().sort((a,b)=>Math.atan2(a.y-c.y,a.x-c.x)-Math.atan2(b.y-c.y,b.x-c.x));let k=0;for(let i=1;i<4;i++)if(q[i].x+q[i].y<q[k].x+q[k].y)k=i;q=q.slice(k).concat(q.slice(0,k));return q}
function lineCross(a,b){const d=a.cos*b.sin-b.cos*a.sin;if(Math.abs(d)<.08)return null;return{x:(a.rho*b.sin-b.rho*a.sin)/d,y:(a.cos*b.rho-b.cos*a.rho)/d}}
function detectCourt(canvas){
 const w=canvas.width,h=canvas.height,pix=canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data,step=2,rmax=Math.ceil(Math.hypot(w,h)),bins=2*rmax+1,nt=90,acc=new Uint16Array(nt*bins),cs=[],sn=[];
 for(let t=0;t<nt;t++){const a=t*Math.PI/90;cs.push(Math.cos(a));sn.push(Math.sin(a))}
 for(let y=2;y<h-2;y+=step)for(let x=2;x<w-2;x+=step){const i=(y*w+x)*4,r=pix[i],g=pix[i+1],b=pix[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);const bright=mx>178&&mx-mn<72,yellow=r>190&&g>150&&b<125&&r-b>65,remembered=data.courtLineColor&&Math.hypot(r-data.courtLineColor.r,g-data.courtLineColor.g,b-data.courtLineColor.b)<115;if(!bright&&!yellow&&!remembered)continue;
   for(let t=0;t<nt;t++){const rho=Math.round(x*cs[t]+y*sn[t])+rmax,ix=t*bins+rho;if(acc[ix]<65535)acc[ix]++}}
 const threshold=Math.max(22,Math.min(w,h)*.20),peaks=[];
 for(let t=0;t<nt;t++)for(let r=4;r<bins-4;r++){const v=acc[t*bins+r];if(v<threshold)continue;let max=true;for(let dt=-2;dt<=2&&max;dt++)for(let dr=-5;dr<=5;dr++){if(!dt&&!dr)continue;const tt=(t+dt+nt)%nt;if(acc[tt*bins+r+dr]>v){max=false;break}}if(max)peaks.push({theta:t*2*Math.PI/180,thetaDeg:t*2,rho:r-rmax,v})}
 peaks.sort((a,b)=>b.v-a.v);const lines=[];for(const p of peaks){if(lines.some(q=>Math.min(Math.abs(q.thetaDeg-p.thetaDeg),180-Math.abs(q.thetaDeg-p.thetaDeg))<5&&Math.abs(q.rho-p.rho)<12))continue;lines.push(p);if(lines.length>=100)break}
 const families=[];for(let t=0;t<180;t+=4){const group=lines.filter(l=>{let d=Math.abs(l.thetaDeg-t);d=Math.min(d,180-d);return d<=12});if(group.length<2)continue;const cx=w/2,cy=h/2,offsets=[];for(const l of group){const off=l.rho-(cx*Math.cos(l.theta)+cy*Math.sin(l.theta));if(!offsets.some(q=>Math.abs(q.off-off)<12))offsets.push({line:l,off})}if(offsets.length<2)continue;let pair=null,score=0;for(let i=0;i<offsets.length;i++)for(let j=i+1;j<offsets.length;j++){const sep=Math.abs(offsets[i].off-offsets[j].off);if(sep<Math.min(w,h)*.32)continue;const sc=sep*Math.min(offsets[i].line.v,offsets[j].line.v);if(sc>score){score=sc;pair=[offsets[i].line,offsets[j].line]}}if(pair)families.push({thetaDeg:t,pair,score})}
 let best=null;for(const a of families)for(const b of families){let da=Math.abs(a.thetaDeg-b.thetaDeg);da=Math.min(da,180-da);if(da<62||da>118)continue;const q=[lineCross(a.pair[0],b.pair[0]),lineCross(a.pair[0],b.pair[1]),lineCross(a.pair[1],b.pair[1]),lineCross(a.pair[1],b.pair[0])];if(q.some(v=>!v||!Number.isFinite(v.x)||!Number.isFinite(v.y)))continue;const area=Math.abs(q.reduce((s,v,i)=>s+v.x*q[(i+1)%4].y-q[(i+1)%4].x*v.y,0)/2);if(area<w*h*.04||area>w*h*8)continue;const outside=q.reduce((n,v)=>n+Math.max(0,-v.x/w,v.x/w-1,-v.y/h,v.y/h-1),0);if(outside>2)continue;const ordered=sortQuad(q),crosses=ordered.map((p,i)=>{const n=ordered[(i+1)%4],m=ordered[(i+2)%4];return(n.x-p.x)*(m.y-n.y)-(n.y-p.y)*(m.x-n.x)});if(crosses.some(v=>Math.abs(v)<1||Math.sign(v)!==Math.sign(crosses[0])))continue;const score=a.score+b.score-outside*Math.min(w,h)*.12-area*.001;if(!best||score>best.score)best={q:ordered,score,confidence:Math.min(1,(a.pair[0].v+a.pair[1].v+b.pair[0].v+b.pair[1].v)/(Math.min(w,h)*1.6))}}
 if(!best)return{corners:[{x:.05,y:.1},{x:.95,y:.1},{x:.95,y:.9},{x:.05,y:.9}],confidence:0,detected:false,extrapolated:false};const corners=best.q.map(p=>({x:p.x/w,y:p.y/h}));return{corners,confidence:best.confidence,detected:true,extrapolated:corners.some(p=>p.x<0||p.x>1||p.y<0||p.y>1)}
}
function rememberCourtLineColor(canvas){const ctx=canvas.getContext('2d',{willReadFrequently:true}),w=canvas.width,h=canvas.height,p=ctx.getImageData(0,0,w,h).data;let r=0,g=0,b=0,n=0;for(let y=2;y<h-2;y+=3)for(let x=2;x<w-2;x+=3){const i=(y*w+x)*4,R=p[i],G=p[i+1],B=p[i+2],mx=Math.max(R,G,B),mn=Math.min(R,G,B);const inside=data.courtCorners&&(()=>{const q=data.courtCorners.map(v=>({x:v.x*w,y:v.y*h}));let sign=0;for(let k=0;k<4;k++){const a=q[k],z=q[(k+1)%4],cross=(z.x-a.x)*(y-a.y)-(z.y-a.y)*(x-a.x);if(Math.abs(cross)<1)continue;if(sign&&Math.sign(cross)!==sign)return false;sign=Math.sign(cross)}return true})();if(inside&&(mx>178&&mx-mn<72||R>190&&G>150&&B<125&&R-B>65)){r+=R;g+=G;b+=B;n++}}if(n)data.courtLineColor={r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n),samples:n}}
function averagePatch(ctx,cx,cy,width,height){const canvas=ctx.canvas,x=Math.max(0,Math.min(canvas.width-width,Math.round(cx-width/2))),y=Math.max(0,Math.min(canvas.height-height,Math.round(cy-height/2))),d=ctx.getImageData(x,y,width,height).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(d[i+3]<32)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}return n?{r:Math.round(r/n),g:Math.round(g/n),b:Math.round(b/n)}:null}
function shirtColor(lm,canvas){const a=lm[11],b=lm[12],h1=lm[23],h2=lm[24];if(!a||!b||!h1||!h2)return null;const x=(a.x+b.x+h1.x+h2.x)/4*canvas.width,y=(a.y+b.y+h1.y+h2.y)/4*canvas.height;return averagePatch(canvas.getContext('2d',{willReadFrequently:true}),x,y,16,20)}
function shoeColor(lm,canvas){const ctx=canvas.getContext('2d',{willReadFrequently:true}),colors=[];for(const side of [0,1]){const ankle=lm[27+side],heel=lm[29+side],toe=lm[31+side];if(!ankle||ankle.visibility<.2)continue;const knee=lm[25+side],legPixels=knee?Math.abs(ankle.y-knee.y)*canvas.height:12,size=Math.max(4,Math.min(10,Math.round(legPixels*.35))),points=[heel,toe].filter(p=>p&&p.visibility>.2),x=points.length?points.reduce((a,p)=>a+p.x,0)/points.length:ankle.x,y=points.length?points.reduce((a,p)=>a+p.y,0)/points.length:ankle.y+size*.3,sample=averagePatch(ctx,x*canvas.width,y*canvas.height,size,size);if(sample)colors.push(sample)}return colors.length?{r:Math.round(colors.reduce((s,c)=>s+c.r,0)/colors.length),g:Math.round(colors.reduce((s,c)=>s+c.g,0)/colors.length),b:Math.round(colors.reduce((s,c)=>s+c.b,0)/colors.length)}:null}
function rgbDistance(a,b){return !a||!b?0:Math.hypot(a.r-b.r,a.g-b.g,a.b-b.b)/441}
function appearanceDistance(candidate,name){const samples=appearanceProfile(name);let best=Infinity;for(const s of samples){const shirt=candidate.shirt&&s.shirt?rgbDistance(candidate.shirt,s.shirt):Infinity,shoes=candidate.shoes&&s.shoes?rgbDistance(candidate.shoes,s.shoes):Infinity,score=Number.isFinite(shirt)&&Number.isFinite(shoes)?shirt*.55+shoes*.45:Number.isFinite(shirt)?shirt:shoes;if(score<best)best=score}return best}
function frameCanvas(){const scale=Math.min(1,720/video.videoWidth),cv=document.createElement('canvas');cv.width=Math.round(video.videoWidth*scale);cv.height=Math.round(video.videoHeight*scale);cv.getContext('2d',{willReadFrequently:true}).drawImage(video,0,0,cv.width,cv.height);return cv}
function solve(a,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let j=i+1;j<n;j++)if(Math.abs(a[j][i])>Math.abs(a[m][i]))m=j;[a[i],a[m]]=[a[m],a[i]];[b[i],b[m]]=[b[m],b[i]];const v=a[i][i];if(Math.abs(v)<1e-10)return null;for(let k=i;k<n;k++)a[i][k]/=v;b[i]/=v;for(let j=0;j<n;j++)if(j!==i){const f=a[j][i];for(let k=i;k<n;k++)a[j][k]-=f*a[i][k];b[j]-=f*b[i]}}return b}
function makeHomography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const{x,y}=src[i],{x:u,y:v}=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v)}const h=solve(A,b);return h?([...h,1]):null}
function project(p,H){if(!H)return p;const d=H[6]*p.x+H[7]*p.y+1;if(Math.abs(d)<1e-8)return p;return{x:(H[0]*p.x+H[1]*p.y+H[2])/d,y:(H[3]*p.x+H[4]*p.y+H[5])/d}}
function updateProjection(){if(!data.courtCorners){courtH=null;courtBackH=null;return}const c=data.courtCorners.map(p=>({x:p.x*video.videoWidth,y:p.y*video.videoHeight}));data.courtOrientation=$('orientation').value;let rotate=data.courtOrientation==='rotate';data.courtRotate=rotate;let dst=rotate?[{x:0,y:1},{x:0,y:0},{x:1,y:0},{x:1,y:1}]:[{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}];if(data.courtOrientation==='flip')dst=dst.map(p=>({x:1-p.x,y:p.y}));courtH=makeHomography(data.courtCorners,dst);courtBackH=makeHomography(dst,data.courtCorners.map(p=>({x:p.x*video.videoWidth,y:p.y*video.videoHeight})));for(const p of rawPlayers){const q=project({x:p.x,y:p.y},courtH);if(!p.manual)data.initialPlayers[p.player]={x:Math.max(0,Math.min(1,q.x)),y:Math.max(0,Math.min(1,q.y)),confidence:p.confidence}}redraw()}
